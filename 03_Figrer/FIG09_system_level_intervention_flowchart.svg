<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="50%" y="50" font-size="30" text-anchor="middle" font-family="Arial">
    Figur 9 – System‑Level Intervention Flowchart
  </text>

  <!-- INTERVENTION CLASSES -->

  <!-- Nutrient -->
  <rect x="80" y="150" width="260" height="120" fill="white" stroke="#1f77b4" stroke-width="3"/>
  <text x="210" y="190" font-size="20" text-anchor="middle" fill="#1f77b4">Nutrient Interventions</text>
  <text x="210" y="215" font-size="14" text-anchor="middle" fill="#1f77b4">
    serin, magnesium, mangan, kolin, metionin
  </text>

  <!-- Metabolic -->
  <rect x="80" y="330" width="260" height="120" fill="white" stroke="#2ca02c" stroke-width="3"/>
  <text x="210" y="370" font-size="20" text-anchor="middle" fill="#2ca02c">Metabolic Interventions</text>
  <text x="210" y="395" font-size="14" text-anchor="middle" fill="#2ca02c">
    NADPH, SAM‑syklus, redox‑buffering
  </text>

  <!-- Structural -->
  <rect x="80" y="510" width="260" height="120" fill="white" stroke="#d62728" stroke-width="3"/>
  <text x="210" y="550" font-size="20" text-anchor="middle" fill="#d62728">Structural Interventions</text>
  <text x="210" y="575" font-size="14" text-anchor="middle" fill="#d62728">
    PC:PE, CL‑remodellering, membranreparasjon
  </text>

  <!-- NODES -->

  <!-- Liquidity Node -->
  <rect x="450" y="150" width="260" height="120" fill="white" stroke="#1f77b4" stroke-width="3"/>
  <text x="580" y="190" font-size="20" text-anchor="middle" fill="#1f77b4">Liquidity Node</text>
  <text x="580" y="215" font-size="14" text-anchor="middle" fill="#1f77b4">
    NADPH, SAM, redox‑likviditet
  </text>

  <!-- Membrane Node -->
  <rect x="450" y="330" width="260" height="120" fill="white" stroke="#2ca02c" stroke-width="3"/>