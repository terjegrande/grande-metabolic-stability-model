<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">

  <style>
    .blk { fill:#e8e8e8; stroke:#000; stroke-width:1.2; }
    .txt { font-family: Arial, sans-serif; font-size:14px; fill:#000; }
    .num { font-family: Arial, sans-serif; font-size:11px; fill:#000; }
    .arrow { stroke:#000; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- 101 Sensor Interface -->
  <rect class="blk" x="50" y="80" width="180" height="80" rx="6" ry="6"/>
  <text class="txt" x="60" y="115">Sensor Interface</text>
  <text class="num" x="60" y="135">101</text>

  <!-- 102 Normalization -->
  <rect class="blk" x="260" y="80" width="180" height="80" rx="6" ry="6"/>
  <text class="txt" x="270" y="115">Normalization Module</text>
  <text class="num" x="270" y="135">102</text>

  <!-- Arrow 101 -> 102 -->
  <line class="arrow" x1="230" y1="120" x2="260" y2="120"/>

  <!-- 103 Fusion -->
  <rect class="blk" x="470" y="80" width="220" height="80" rx="6" ry="6"/>
  <text class="txt" x="480" y="115">Multi‑Sensor Fusion Engine</text>
  <text class="num" x="480" y="135">103</text>

  <!-- Arrow 102 -> 103 -->
  <line class="arrow" x1="440" y1="120" x2="470" y2="120"/>

  <!-- 104 Aepi -->
  <rect class="blk" x="200" y="220" width="180" height="80" rx="6" ry="6"/>
  <text class="txt" x="210" y="255">Aepi Module</text>
  <text class="num" x="210" y="275">104</text>

  <!-- 105 Zeta -->
  <rect class="blk" x="420" y="220" width="180" height="80" rx="6" ry="6"/>
  <text class="txt" x="430" y="255">ζ Module</text>
  <text class="num" x="430" y="275">105</text>

  <!-- 106 Stability -->
  <rect class="blk" x="640" y="220" width="220" height="80" rx="6" ry="6"/>
  <text class="txt" x="650" y="255">Stability Module (S)</text>
  <text class="num" x="650" y="275">106</text>

  <!-- Arrows from Fusion to Aepi and Zeta -->
  <line class="arrow" x1="580" y1="160" x2="290" y2="220"/>
  <line class="arrow" x1="580" y1="160" x2="510" y2="220"/>

  <!-- Arrows from Aepi & Zeta to Stability -->
  <line class="arrow" x1="380" y1="260" x2="640" y2="260"/>
  <line class="arrow" x1="600" y1="260" x2="640" y2="260"/>

  <!-- 107 MPC -->
  <rect class="blk" x="420" y="360" width="220" height="100" rx="6" ry="6"/>
  <text class="txt" x="430" y="410">MPC Module</text>
  <text class="num" x="430" y="430">107</text>

  <!-- Arrows to MPC -->
  <line class="arrow" x1="580" y1="160" x2="530" y2="360"/>
  <line class="arrow" x1="750" y1="300" x2="640" y2="360"/>

  <!-- 108 Safety -->
  <rect class="blk" x="700" y="360" width="220" height="100" rx="6" ry="6"/>
  <text class="txt" x="710" y="410">Safety Module</text>
  <text class="num" x="710" y="430">108</text>

  <!-- Arrow MPC -> Safety -->
  <line class="arrow" x1="640" y1="410" x2="700" y2="410"/>

  <!-- Return arrow Safety -> MPC -->
  <line class="arrow" x1="700" y1="440" x2="640" y2="440"/>

  <!-- 301 Digital Twin -->
  <rect class="blk" x="50" y="360" width="300" height="140" rx="6" ry="6"/>
  <text class="txt" x="60" y="410">Digital Twin</text>
  <text class="num" x="60" y="430">301</text>

  <!-- Arrows Digital Twin -->
  <line class="arrow" x1="350" y1="390" x2="260" y2="160"/>
  <line class="arrow" x1="350" y1="430" x2="470" y2="120"/>
  <line class="arrow" x1="350" y1="470" x2="420" y2="410"/>

</svg>
