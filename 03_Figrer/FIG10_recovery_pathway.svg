<svg width="1200" height="850" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="50%" y="50" font-size="30" text-anchor="middle" font-family="Arial">
    Figur 10 – Recovery Pathway
  </text>

  <!-- AXES -->
  <line x1="150" y1="700" x2="1050" y2="700" stroke="black" stroke-width="2"/>
  <text x="1070" y="705" font-size="16">Belastning / Stress (L)</text>

  <line x1="150" y1="700" x2="150" y2="150" stroke="black" stroke-width="2"/>
  <text x="140" y="140" font-size="16">Stabilitet (S)</text>

  <!-- Collapse curve -->
  <path d="M 150 300
           C 300 350, 450 450, 600 600
           C 750 650, 900 680, 1050 690"
        stroke="#d62728" stroke-width="4" fill="none"/>
  <text x="350" y="360" font-size="16" fill="#d62728">Collapse‑path</text>

  <!-- Recovery curve -->
  <path d="M 1050 690
           C 900 600, 750 500, 600 420
           C 450 350, 300 260, 150 220"
        stroke="#2ca02c" stroke-width="4" fill="none"/>
  <text x="850" y="580" font-size="16" fill="#2ca02c">Recovery‑path</text>

  <!-- Irreversibility window -->
  <rect x="450" y="150" width="300" height="550"
        fill="none" stroke="#ff7f0e" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="600" y="180" font-size="16" text-anchor="middle" fill="#ff7f0e">
    Irreversibility Window
  </text>

  <!-- Stability basin -->
  <rect x="150" y="150" width="250" height="550"
        fill="#e8ffe8" stroke="#2ca02c" stroke-width="2"/>
  <text x="275" y="180" font-size="16" text-anchor="middle" fill="#2ca02c">
    Stability Basin
  </text>

  <!-- Collapse basin -->
  <rect x="750" y="150" width="300" height="550"
        fill="#ffe8e8" stroke="#d62728" stroke-width="2"/>
  <text x="900" y="180" font-size="16" text-anchor="middle" fill="#d62728">
    Collapse Basin
  </text>

  <!-- Arrows showing direction -->
  <line x1="500" y1="500" x2="550" y2="550" stroke="#d62728" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="850" y1="600" x2="800" y2="550" stroke="#2ca02c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Intervention stages -->

  <!-- Stage 1 -->
  <rect x="150" y="750" width="250" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="275" y="780" font-size="16" text-anchor="middle">1. Reduce ζ (friksjon)</text>
  <text x="275" y="800" font-size="12" text-anchor="middle">inflamm., redox, CL‑støtte</text>

  <!-- Stage 2 -->
  <rect x="450" y="750" width="250" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="575" y="780" font-size="16" text-anchor="middle">2. Stabilize S</text>
  <text x="575" y="800" font-size="12" text-anchor="middle">nervesystem, rytmer, søvn</text>

  <!-- Stage 3 -->
  <rect x="750" y="750" width="250" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="875" y="780" font-size="16" text-anchor="middle">3. Rebuild Capacity</text>
  <text x="875" y="800" font-size="12" text-anchor="middle">MGI, CL, metabolsk styrke</text>

  <!-- Arrows between stages -->
  <line x1="400" y1="780" x2="450" y2="780" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="780" x2="750" y2="780" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
  </defs>

</svg>
