<svg width="1200" height="750" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="50%" y="50" font-size="30" text-anchor="middle" font-family="Arial">
    Figur 8 – Intervention Map
  </text>

  <!-- THREE NODES -->

  <!-- Liquidity Node -->
  <rect x="150" y="150" width="250" height="120" fill="white" stroke="#1f77b4" stroke-width="3"/>
  <text x="275" y="190" font-size="20" text-anchor="middle" fill="#1f77b4">Liquidity Node</text>
  <text x="275" y="215" font-size="14" text-anchor="middle" fill="#1f77b4">NADPH, SAM, redox</text>

  <!-- Membrane Node -->
  <rect x="150" y="330" width="250" height="120" fill="white" stroke="#2ca02c" stroke-width="3"/>
  <text x="275" y="370" font-size="20" text-anchor="middle" fill="#2ca02c">Membrane Node</text>
  <text x="275" y="395" font-size="14" text-anchor="middle" fill="#2ca02c">PC:PE, CL‑remodellering</text>

  <!-- Friction Node -->
  <rect x="150" y="510" width="250" height="120" fill="white" stroke="#d62728" stroke-width="3"/>
  <text x="275" y="550" font-size="20" text-anchor="middle" fill="#d62728">Friction Node</text>