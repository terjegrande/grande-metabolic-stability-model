<svg width="900" height="520" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="50%" y="40" font-size="26" text-anchor="middle" font-family="Arial">
    Figur 5 – Aepi‑beregning
  </text>

  <!-- Inputs block -->
  <rect x="80" y="140" width="200" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="180" y="175" font-size="18" text-anchor="middle">Tilstandsvariabler</text>
  <text x="180" y="195" font-size="14" text-anchor="middle">ζ(t), L(t), S(t)</text>
  <text x="180" y="215" font-size="12" text-anchor="middle">fra Digital Twin</text>

  <!-- Arrow: Inputs -> Aepi block -->
  <line x1="280" y1="200" x2="360" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Aepi block -->
  <rect x="360" y="140" width="220" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="470" y="175" font-size="18" text-anchor="middle">Aepi‑beregning</text>
  <text x="470" y="195" font-size="14" text-anchor="middle">Aepi(t) = f(ζ(t), L(t), S(t))</text>
  <text x="470" y="215" font-size="12" text-anchor="middle">metabolsk stabilitet / epigenetisk belastning</text>

  <!-- Arrow: Aepi -> Cost -->
  <line x1="580" y1="200" x2="660" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cost block -->
  <rect x="660" y="140" width="180" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="175" font-size="18" text-anchor="middle">Kostfunksjon J</text>
  <text x="750" y="195" font-size="14" text-anchor="middle">J = g(Aepi, ζ, S)</text>
  <text x="750" y="215" font-size="12" text-anchor="middle">brukes i MPC‑sløyfen</text>

  <!-- Aepi time series plot -->
  <text x="150" y="320" font-size="16" text-anchor="middle">Aepi(t)</text>
  <line x1="80" y1="340" x2="320" y2="340" stroke="black" stroke-width="1"/>
  <line x1="80" y1="340" x2="80" y2="260" stroke="black" stroke-width="1"/>

  <path d="M 80 330
           C 120 310, 160 280, 200 290
           C 240 300, 280 320, 320 270"
        stroke="#ff0000" stroke-width="3" fill="none"/>

  <text x="320" y="355" font-size="12" text-anchor="end">t</text>
  <text x="70" y="265" font-size="12" text-anchor="end">høy belastning</text>

  <!-- Stability annotation -->
  <rect x="360" y="320" width="220" height="120" fill="white" stroke="#008000" stroke-width="2"/>
  <text x="470" y="355" font-size="18" text-anchor="middle" fill="#008000">Stabilitetsvindu</text>
  <text x="470" y="375" font-size="12" text-anchor="middle" fill="#008000">
    Aepi(t) innenfor terskel → stabil metabolsk tilstand
  </text>
  <text x="470" y="395" font-size="12" text-anchor="middle" fill="#008000">
    Aepi(t) over terskel → økt risiko / intervensjon
  </text>

  <!-- Arrow: Aepi plot -> Stability -->
  <line x1="320" y1="300" x2="360" y2="340" stroke="#008000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Link to MPC -->
  <line x1="660" y1="260" x2="750" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="340" font-size="12" text-anchor="middle">
    J brukes i MPC‑sløyfen (Figur 3)
  </text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
  </defs>

</svg>
