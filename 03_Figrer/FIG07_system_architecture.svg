<svg width="1100" height="700" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="50%" y="50" font-size="28" text-anchor="middle" font-family="Arial">
    Figur 7 – Systemarkitektur
  </text>

  <!-- SENSOR BLOCKS -->

  <!-- Wearables -->
  <rect x="60" y="150" width="200" height="70" fill="white" stroke="#1f77b4" stroke-width="2"/>
  <text x="160" y="185" font-size="16" text-anchor="middle" fill="#1f77b4">Wearables</text>
  <text x="160" y="205" font-size="12" text-anchor="middle" fill="#1f77b4">HRV, puls, aktivitet</text>

  <!-- Blood tests -->
  <rect x="60" y="250" width="200" height="70" fill="white" stroke="#2ca02c" stroke-width="2"/>
  <text x="160" y="285" font-size="16" text-anchor="middle" fill="#2ca02c">Blodprøver</text>
  <text x="160" y="305" font-size="12" text-anchor="middle" fill="#2ca02c">glukose, lipider, Hcy</text>

  <!-- Phone sensors -->
  <rect x="60" y="350" width="200" height="70" fill="white" stroke="#9467bd" stroke-width="2"/>
  <text x="160" y="385" font-size="16" text-anchor="middle" fill="#9467bd">Telefon-sensorer</text>
  <text x="160" y="405" font-size="12" text-anchor="middle" fill="#9467bd">GPS, akselerometer</text>

  <!-- Sleep -->
  <rect x="60" y="450" width="200" height="70" fill="white" stroke="#d62728" stroke-width="2"/>
  <text x="160" y="485" font-size="16" text-anchor="middle" fill="#d62728">Søvn</text>
  <text x="160" y="505" font-size="12" text-anchor="middle" fill="#d62728">kvalitet, varighet</text>

  <!-- Nutrition -->
  <rect x="60" y="550" width="200" height="70" fill="white" stroke="#ff7f0e" stroke-width="2"/>
  <text x="160" y="585" font-size="16" text-anchor="middle" fill="#ff7f0e">Ernæring</text>
  <text x="160" y="605" font-size="12" text-anchor="middle" fill="#ff7f0e">måltider, timing</text>

  <!-- SENSOR FUSION -->
  <rect x="330" y="300" width="240" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="450" y="340" font-size="20" text-anchor="middle">Sensor Fusion</text>
  <text x="450" y="365" font-size="14" text-anchor="middle">filtrering + vekting</text>

  <!-- Arrows sensors -> fusion -->
  <line x1="260" y1="185" x2="330" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="285" x2="330" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="385" x2="330" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="485" x2="330" y2="390" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="585" x2="330" y2="420" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DIGITAL TWIN -->
  <rect x="630" y="150" width="260" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="760" y="190" font-size="20" text-anchor="middle">Digital Twin</text>
  <text x="760" y="215" font-size="14" text-anchor="middle">prediksjon av ζ(t+1), L(t+1), S(t+1)</text>

  <!-- Arrow fusion -> twin -->
  <line x1="570" y1="360" x2="760" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AEPI BLOCK -->
  <rect x="630" y="320" width="260" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="760" y="360" font-size="20" text-anchor="middle">Aepi‑beregning</text>
  <text x="760" y="385" font-size="14" text-anchor="middle">Aepi(t) = f(ζ, L, S)</text>

  <!-- Arrow twin -> aepi -->
  <line x1="760" y1="270" x2="760" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MPC BLOCK -->
  <rect x="630" y="490" width="260" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="760" y="530" font-size="20" text-anchor="middle">MPC‑sløyfe</text>
  <text x="760" y="555" font-size="14" text-anchor="middle">optimalisering av u(t)</text>

  <!-- Arrow aepi -> mpc -->
  <line x1="760" y1="440" x2="760" y2="490" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ACTION OUTPUT -->
  <rect x="950" y="490" width="120" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="1010" y="540" font-size="20" text-anchor="middle">u(t)</text>
  <text x="1010" y="565" font-size="12" text-anchor="middle">intervensjon</text>

  <!-- Arrow mpc -> action -->
  <line x1="890" y1="550" x2="950" y2="550" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow action -> sensors (feedback loop) -->
  <line x1="1010" y1="490" x2="1010" y2="150" stroke="black" stroke-width="2"/>
  <line x1="1010" y1="150" x2="160" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
  </defs>

</svg>
