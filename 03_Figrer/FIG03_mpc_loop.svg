<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="50%" y="40" font-size="24" text-anchor="middle" font-family="Arial">
    Figur 3 – MPC‑sløyfen
  </text>

  <!-- Block: State -->
  <rect x="60" y="120" width="150" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="135" y="165" font-size="18" text-anchor="middle">State</text>
  <text x="135" y="185" font-size="12" text-anchor="middle">ζ, L, S</text>

  <!-- Arrow: State → Prediction -->
  <line x1="210" y1="160" x2="260" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Block: Prediction -->
  <rect x="260" y="120" width="180" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="350" y="155" font-size="18" text-anchor="middle">Prediction</text>
  <text x="350" y="175" font-size="12" text-anchor="middle">Twin: S(t+1), ζ(t+1), L(t+1)</text>

  <!-- Arrow: Prediction → Cost -->
  <line x1="440" y1="160" x2="490" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Block: Cost -->
  <rect x="490" y="120" width="160" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="570" y="155" font-size="18" text-anchor="middle">Cost</text>
  <text x="570" y="175" font-size="12" text-anchor="middle">Aepi, ζ, S</text>

  <!-- Arrow: Cost → Optimize -->
  <line x1="650" y1="160" x2="700" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Block: Optimize -->
  <rect x="700" y="120" width="160" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="780" y="155" font-size="18" text-anchor="middle">Optimize</text>
  <text x="780" y="175" font-size="12" text-anchor="middle">min J(u)</text>

  <!-- Arrow: Optimize → Action -->
  <line x1="780" y1="200" x2="780" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Block: Action -->
  <rect x="700" y="260" width="160" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="780" y="300" font-size="18" text-anchor="middle">Action</text>
  <text x="780" y="320" font-size="12" text-anchor="middle">u(t)</text>

  <!-- Arrow: Action → State -->
  <line x1="700" y1="300" x2="135" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Safety block -->
  <rect x="350" y="260" width="160" height="80" fill="white" stroke="red" stroke-width="2"/>
  <text x="430" y="300" font-size="18" text-anchor="middle" fill="red">Safety</text>
  <text x="430" y="320" font-size="12" text-anchor="middle" fill="red">Override</text>

  <!-- Arrow: Action → Safety -->
  <line x1="780" y1="300" x2="510" y2="300" stroke="red" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Safety → State -->
  <line x1="350" y1="300" x2="210" y2="300" stroke="red" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
  </defs>

</svg>
